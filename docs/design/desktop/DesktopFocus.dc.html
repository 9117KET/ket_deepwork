<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #0d0f11; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #00daf3; } a:hover { color: #00b6cb; }
  </style>
</helmet>
<div style="width: 1440px; height: 900px; background: #0d0f11; color: #e2e2e6; overflow: hidden; display: flex; flex-direction: column; position: relative;">

  <div style="position: absolute; top: 50%; left: 50%; width: 900px; height: 900px; transform: translate(-50%, -50%); border-radius: 50%; background: radial-gradient(circle, rgba(0,218,243,0.06) 0%, rgba(0,218,243,0) 68%); pointer-events: none;"></div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 26px 32px; position: relative;">
    <div style="display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; color: #7d8a8f;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7d8a8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      <span>Leave focus</span>
    </div>
    <div style="font-size: 13px; color: #7d8a8f;">Block 3 of 5 today &middot; 2h 15m deep so far</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 86px; position: relative;">

    <div style="position: relative; width: 340px; height: 340px; flex-shrink: 0;">
      <svg width="340" height="340" viewBox="0 0 340 340" style="position: absolute; inset: 0; transform: rotate(-90deg);">
        <circle cx="170" cy="170" r="158" fill="none" stroke="#1c2023" stroke-width="5"/>
        <circle cx="170" cy="170" r="158" fill="none" stroke="#00daf3" stroke-width="5" stroke-linecap="round" stroke-dasharray="993" stroke-dashoffset="288"/>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <div style="font-family: 'Epilogue', system-ui, sans-serif; font-weight: 800; font-size: 82px; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; line-height: 1;">31:12</div>
        <div style="margin-top: 12px; font-size: 13px; font-weight: 600; color: #7d8a8f;">of a 45 minute block</div>
      </div>
    </div>

    <div style="max-width: 400px;">
      <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.1em; color: #00daf3;">WORKING ON</div>
      <div style="margin-top: 14px; font-family: 'Epilogue', system-ui, sans-serif; font-weight: 800; font-size: 32px; line-height: 1.22; letter-spacing: -0.02em;">Write the sync design doc</div>

      <div style="display: flex; gap: 8px; margin-top: 24px; max-width: 300px;">
        <div style="flex: 1; height: 10px; border-radius: 5px; background: #00daf3;"></div>
        <div style="flex: 1; height: 10px; border-radius: 5px; background: #00daf3;"></div>
        <div style="flex: 1; height: 10px; border-radius: 5px; background: #1c2023;"></div>
      </div>
      <div style="margin-top: 11px; font-size: 13px; color: #bcc9ce;">
        <span style="color: #e2e2e6; font-weight: 600;">1h 30m</span> done of 2h 15m planned &mdash; this block fills the third
      </div>

      <div style="display: flex; align-items: center; gap: 12px; margin-top: 32px;">
        <div style="height: 52px; padding: 0 26px; border-radius: 14px; background: #00daf3; color: #00363d; display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 15px;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="#00363d"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
          <span>Pause</span>
        </div>
        <div style="width: 52px; height: 52px; border-radius: 14px; background: #16191c; border: 1px solid #2a3033; display: flex; align-items: center; justify-content: center;">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </div>
        <div style="height: 52px; padding: 0 20px; border-radius: 14px; background: #16191c; border: 1px solid #2a3033; display: flex; align-items: center; gap: 9px; font-size: 14px; font-weight: 600; color: #bcc9ce;">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          <span>Finish early</span>
        </div>
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="text-align: center; padding-bottom: 34px; font-size: 13px; color: #556064; position: relative;">
    The sidebar and the day are hidden while a block runs. Press Esc to bring them back.
  </div>
</div>
</x-dc>
</body>
</html>
