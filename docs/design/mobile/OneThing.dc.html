<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #111316; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #00daf3; } a:hover { color: #00b6cb; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #111316; color: #e2e2e6; overflow: hidden; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 20px 20px 0 20px;">
    <div style="font-size: 12px; font-weight: 600; color: #bcc9ce;">Wed, Sep 2</div>
    <div style="display: flex; gap: 5px;">
      <span style="width: 18px; height: 3px; border-radius: 2px; background: #00daf3;"></span>
      <span style="width: 18px; height: 3px; border-radius: 2px; background: #00daf3;"></span>
      <span style="width: 18px; height: 3px; border-radius: 2px; background: #00daf3;"></span>
      <span style="width: 18px; height: 3px; border-radius: 2px; background: #3d494d;"></span>
      <span style="width: 18px; height: 3px; border-radius: 2px; background: #23262a;"></span>
      <span style="width: 18px; height: 3px; border-radius: 2px; background: #23262a;"></span>
      <span style="width: 18px; height: 3px; border-radius: 2px; background: #23262a;"></span>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 32px;">
    <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.1em; color: #00daf3;">HIGH PRIORITY &middot; 8:30</div>
    <div style="margin-top: 16px; font-family: 'Epilogue', system-ui, sans-serif; font-weight: 800; font-size: 32px; line-height: 1.2; letter-spacing: -0.02em; color: #e2e2e6;">Write the sync design doc</div>

    <div style="display: flex; gap: 7px; margin-top: 28px;">
      <div style="flex: 1; height: 10px; border-radius: 5px; background: #00daf3;"></div>
      <div style="flex: 1; height: 10px; border-radius: 5px; background: #00daf3;"></div>
      <div style="flex: 1; height: 10px; border-radius: 5px; background: #23262a;"></div>
    </div>
    <div style="margin-top: 10px; font-size: 13px; color: #bcc9ce;">1h 30m of 2h 15m</div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="padding: 0 32px;">
    <div style="height: 56px; border-radius: 14px; background: #00daf3; color: #00363d; display: flex; align-items: center; justify-content: center; gap: 9px; font-weight: 800; font-size: 16px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="#00363d"><path d="M8 5v14l11-7z"/></svg>
      <span>Start 45m block</span>
    </div>
    <div style="display: flex; gap: 10px; margin-top: 10px;">
      <div style="flex: 1; height: 48px; border-radius: 14px; background: #1a1c1f; border: 1px solid #3d494d; display: flex; align-items: center; justify-content: center; gap: 7px; font-weight: 600; font-size: 14px; color: #bcc9ce;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <span>Done</span>
      </div>
      <div style="flex: 1; height: 48px; border-radius: 14px; background: #1a1c1f; border: 1px solid #3d494d; display: flex; align-items: center; justify-content: center; gap: 7px; font-weight: 600; font-size: 14px; color: #bcc9ce;">
        <span>Next</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>
  </div>

  <div style="text-align: center; padding: 26px 0 18px 0; font-size: 12px; color: #7d8a8f;">Swipe up for the full day</div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #23262a; background: #131518; padding: 8px 8px 22px 8px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; color: #00daf3;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#00daf3" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3" fill="#00daf3" stroke="none"/></svg>
      <span style="font-size: 10px; font-weight: 700;">Today</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; color: #7d8a8f;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7d8a8f" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4.5l3 2M9 2h6"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Focus</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; color: #7d8a8f;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7d8a8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Habits</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; color: #7d8a8f;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7d8a8f" stroke-width="2" stroke-linecap="round"><path d="M5 20V9M12 20V4M19 20v-7"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Review</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
