<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #111316; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #00daf3; } a:hover { color: #00b6cb; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #111316; color: #e2e2e6; overflow: hidden; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0 20px;">
    <div style="font-family: 'Epilogue', system-ui, sans-serif; font-weight: 800; font-size: 21px; color: #e2e2e6;">Review</div>
    <div style="display: flex; align-items: center; gap: 2px; border-radius: 11px; background: #1a1c1f; border: 1px solid #3d494d; padding: 3px;">
      <div style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </div>
      <span style="font-size: 12px; font-weight: 700; color: #e2e2e6; padding: 0 6px;">September</span>
      <div style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
      </div>
    </div>
  </div>

  <div style="margin: 20px 20px 0 20px; padding: 18px; border-radius: 18px; background: #1a1c1f;">
    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.09em; color: #bcc9ce;">DEEP WORK THIS WEEK</div>
      <div style="font-size: 11px; color: #7d8a8f;">goal 20h</div>
    </div>
    <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 10px;">
      <span style="font-family: 'Epilogue', system-ui, sans-serif; font-weight: 800; font-size: 38px; letter-spacing: -0.02em; color: #e2e2e6; line-height: 1;">12.5</span>
      <span style="font-size: 14px; font-weight: 600; color: #bcc9ce;">hours</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; margin-top: 18px; align-items: end; height: 64px;">
      <div style="height: 38%; border-radius: 5px 5px 0 0; background: #00daf3;"></div>
      <div style="height: 62%; border-radius: 5px 5px 0 0; background: #00daf3;"></div>
      <div style="height: 84%; border-radius: 5px 5px 0 0; background: #00daf3;"></div>
      <div style="height: 55%; border-radius: 5px 5px 0 0; background: #00daf3;"></div>
      <div style="height: 100%; border-radius: 5px 5px 0 0; background: #00daf3;"></div>
      <div style="height: 20%; border-radius: 5px 5px 0 0; background: #23262a;"></div>
      <div style="height: 12%; border-radius: 5px 5px 0 0; background: #23262a;"></div>
    </div>
    <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 7px; margin-top: 8px; text-align: center; font-size: 10px; color: #7d8a8f;">
      <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
    </div>
  </div>

  <div style="margin: 12px 20px 0 20px; padding: 18px; border-radius: 18px; background: #1a1c1f;">
    <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.09em; color: #bcc9ce;">BLOCK COMPLETION</div>
    <div style="display: flex; align-items: baseline; gap: 8px; margin-top: 10px;">
      <span style="font-family: 'Epilogue', system-ui, sans-serif; font-weight: 800; font-size: 38px; letter-spacing: -0.02em; color: #e2e2e6; line-height: 1;">68</span>
      <span style="font-size: 14px; font-weight: 600; color: #bcc9ce;">% this month</span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid #23262a;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
      <span style="flex: 1; font-size: 13px; font-weight: 600; color: #e2e2e6;">Open the month grid</span>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3d494d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>

  <div style="margin: 22px 20px 0 20px; display: flex; flex-direction: column;">
    <div style="display: flex; align-items: center; gap: 13px; padding: 15px 2px; border-bottom: 1px solid #23262a;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h13v18H6a2 2 0 0 1-2-2z"/><path d="M9 3v18"/></svg>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 600; color: #e2e2e6;">Day journal</div>
        <div style="font-size: 11px; color: #7d8a8f; margin-top: 2px;">Written today</div>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3d494d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; padding: 15px 2px; border-bottom: 1px solid #23262a;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 600; color: #e2e2e6;">Weekly review</div>
        <div style="font-size: 11px; color: #00daf3; margin-top: 2px;">Due Friday</div>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3d494d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; padding: 15px 2px; border-bottom: 1px solid #23262a;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 600; color: #e2e2e6;">Monthly review</div>
        <div style="font-size: 11px; color: #7d8a8f; margin-top: 2px;">In 28 days</div>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3d494d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; padding: 15px 2px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.4 6.3 6.6.3-5.2 4.1 1.8 6.3-5.6-3.7-5.6 3.7 1.8-6.3L3 9.6l6.6-.3z"/></svg>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 600; color: #e2e2e6;">Goals &amp; North Star</div>
        <div style="font-size: 11px; color: #7d8a8f; margin-top: 2px;">Life &rarr; 5yr &rarr; 1yr &rarr; 6mo</div>
      </div>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#3d494d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #23262a; background: #131518; padding: 8px 8px 22px 8px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; color: #7d8a8f;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7d8a8f" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3" fill="#7d8a8f" stroke="none"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Today</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; color: #7d8a8f;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7d8a8f" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4.5l3 2M9 2h6"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Focus</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; color: #7d8a8f;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7d8a8f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Habits</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; color: #00daf3;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#00daf3" stroke-width="2" stroke-linecap="round"><path d="M5 20V9M12 20V4M19 20v-7"/></svg>
      <span style="font-size: 10px; font-weight: 700;">Review</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
