<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #111316; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #00daf3; } a:hover { color: #00b6cb; }
    .dot { width: 7px; height: 7px; border-radius: 50%; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #111316; color: #e2e2e6; overflow: hidden; display: flex; flex-direction: column;">

  <div style="padding: 18px 20px 0 20px;">
    <div style="font-family: 'Epilogue', system-ui, sans-serif; font-weight: 800; font-size: 21px; color: #e2e2e6;">Habits</div>
    <div style="margin-top: 4px; font-size: 12px; color: #bcc9ce;">4 of 9 today</div>
  </div>

  <div style="margin: 18px 20px 0 20px; padding: 15px 16px; border-radius: 14px; background: #1a1c1f; border-left: 2px solid #00daf3;">
    <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.09em; color: #bcc9ce;">I AM</div>
    <div style="margin-top: 6px; font-family: 'Epilogue', system-ui, sans-serif; font-weight: 700; font-size: 15px; line-height: 1.35; color: #e2e2e6;">someone who does the hard thing first</div>
  </div>

  <div style="margin: 22px 20px 0 20px; display: flex; flex-direction: column; gap: 8px;">

    <div style="display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-radius: 13px; background: #1a1c1f;">
      <div style="width: 24px; height: 24px; border-radius: 8px; background: #00daf3; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00363d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 600; color: #e2e2e6;">Deep work</div>
        <div style="display: flex; gap: 4px; margin-top: 6px;">
          <span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span>
        </div>
      </div>
      <div style="font-size: 12px; font-weight: 700; color: #bcc9ce; font-variant-numeric: tabular-nums;">21</div>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-radius: 13px; background: #1a1c1f;">
      <div style="width: 24px; height: 24px; border-radius: 8px; background: #00daf3; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00363d" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      </div>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 600; color: #e2e2e6;">Journaling</div>
        <div style="display: flex; gap: 4px; margin-top: 6px;">
          <span class="dot" style="background: #23262a;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #23262a;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span>
        </div>
      </div>
      <div style="font-size: 12px; font-weight: 700; color: #bcc9ce; font-variant-numeric: tabular-nums;">2</div>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-radius: 13px; background: #1a1c1f; border: 1px solid #ffb77d;">
      <div style="width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid #3d494d; flex-shrink: 0;"></div>
      <div style="flex: 1;">
        <div style="display: flex; align-items: center; gap: 6px;">
          <span style="font-size: 14px; font-weight: 600; color: #e2e2e6;">Gym</span>
          <span style="font-size: 10px; font-weight: 700; color: #ffb77d;">missed yesterday</span>
        </div>
        <div style="display: flex; gap: 4px; margin-top: 6px;">
          <span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #ffb77d;"></span><span class="dot" style="background: #23262a;"></span>
        </div>
      </div>
      <div style="font-size: 12px; font-weight: 700; color: #bcc9ce; font-variant-numeric: tabular-nums;">0</div>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-radius: 13px; background: #1a1c1f;">
      <div style="width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid #3d494d; flex-shrink: 0;"></div>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 600; color: #e2e2e6;">Eat clean</div>
        <div style="display: flex; gap: 4px; margin-top: 6px;">
          <span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #23262a;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #23262a;"></span>
        </div>
      </div>
      <div style="font-size: 12px; font-weight: 700; color: #bcc9ce; font-variant-numeric: tabular-nums;">4</div>
    </div>

    <div style="display: flex; align-items: center; gap: 13px; padding: 12px 14px; border-radius: 13px; background: #1a1c1f;">
      <div style="width: 24px; height: 24px; border-radius: 8px; border: 1.5px solid #3d494d; flex-shrink: 0;"></div>
      <div style="flex: 1;">
        <div style="font-size: 14px; font-weight: 600; color: #e2e2e6;">Bed before 23:00</div>
        <div style="display: flex; gap: 4px; margin-top: 6px;">
          <span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #23262a;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #00daf3;"></span><span class="dot" style="background: #23262a;"></span>
        </div>
      </div>
      <div style="font-size: 12px; font-weight: 700; color: #bcc9ce; font-variant-numeric: tabular-nums;">3</div>
    </div>

  </div>

  <div style="margin: 18px 20px 0 20px; font-size: 11px; color: #7d8a8f;">Last 7 days. The full month grid lives in Review.</div>

  <div style="flex-grow: 1;"></div>

  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid #23262a; background: #131518; padding: 8px 8px 22px 8px;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; color: #7d8a8f;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7d8a8f" stroke-width="2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3" fill="#7d8a8f" stroke="none"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Today</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; color: #7d8a8f;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7d8a8f" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4.5l3 2M9 2h6"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Focus</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; color: #00daf3;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#00daf3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
      <span style="font-size: 10px; font-weight: 700;">Habits</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px 0; color: #7d8a8f;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#7d8a8f" stroke-width="2" stroke-linecap="round"><path d="M5 20V9M12 20V4M19 20v-7"/></svg>
      <span style="font-size: 10px; font-weight: 600;">Review</span>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
