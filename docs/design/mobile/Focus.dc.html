<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Epilogue:wght@700;800;900&family=Manrope:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; background: #111316; font-family: 'Manrope', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    * { box-sizing: border-box; }
    a { color: #00daf3; } a:hover { color: #00b6cb; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #111316; color: #e2e2e6; overflow: hidden; display: flex; flex-direction: column;">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0 20px;">
    <div style="width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </div>
    <div style="font-size: 12px; font-weight: 600; color: #bcc9ce;">Block 3 of 5 today</div>
    <div style="width: 40px; height: 40px;"></div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="text-align: center; padding: 0 32px;">
    <div style="font-size: 10px; font-weight: 800; letter-spacing: 0.09em; color: #bcc9ce;">WORKING ON</div>
    <div style="margin-top: 10px; font-family: 'Epilogue', system-ui, sans-serif; font-weight: 700; font-size: 18px; line-height: 1.3; color: #e2e2e6;">Write the sync design doc</div>
  </div>

  <div style="position: relative; width: 260px; height: 260px; margin: 40px auto 0 auto;">
    <svg width="260" height="260" viewBox="0 0 260 260" style="position: absolute; inset: 0; transform: rotate(-90deg);">
      <circle cx="130" cy="130" r="120" fill="none" stroke="#23262a" stroke-width="4"/>
      <circle cx="130" cy="130" r="120" fill="none" stroke="#00daf3" stroke-width="4" stroke-linecap="round" stroke-dasharray="754" stroke-dashoffset="219"/>
    </svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <div style="font-family: 'Epilogue', system-ui, sans-serif; font-weight: 800; font-size: 62px; letter-spacing: -0.03em; color: #e2e2e6; font-variant-numeric: tabular-nums; line-height: 1;">31:12</div>
      <div style="margin-top: 10px; font-size: 12px; font-weight: 600; color: #bcc9ce;">of a 45 minute block</div>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 44px;">
    <div style="width: 56px; height: 56px; border-radius: 50%; background: #1a1c1f; border: 1px solid #3d494d; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
    </div>
    <div style="width: 82px; height: 82px; border-radius: 50%; background: #00daf3; display: flex; align-items: center; justify-content: center;">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="#00363d"><rect x="6" y="4" width="4" height="16" rx="1.4"/><rect x="14" y="4" width="4" height="16" rx="1.4"/></svg>
    </div>
    <div style="width: 56px; height: 56px; border-radius: 50%; background: #1a1c1f; border: 1px solid #3d494d; display: flex; align-items: center; justify-content: center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#bcc9ce" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>

  <div style="text-align: center; padding-bottom: 34px; font-size: 12px; color: #7d8a8f;">
    Finishing this fills one box on the task
  </div>
</div>
</x-dc>
</body>
</html>
